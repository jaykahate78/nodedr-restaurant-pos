        run: |
          set -euo pipefail
          mkdir -p apps/web/public/menu-generated
          curl -fL --retry 3 --max-time 40 "$PHOTO_1" -o "apps/web/public/menu-generated/regular-pavbhaji.png"
          curl -fL --retry 3 --max-time 40 "$PHOTO_2" -o "apps/web/public/menu-generated/saoji-pavbhaji.png"
          curl -fL --retry 3 --max-time 40 "$PHOTO_3" -o "apps/web/public/menu-generated/mushroom-pavbhaji.png"
          curl -fL --retry 3 --max-time 40 "$PHOTO_4" -o "apps/web/public/menu-generated/paneer-pavbhaji.png"
          curl -fL --retry 3 --max-time 40 "$PHOTO_5" -o "apps/web/public/menu-generated/tawa-pulav.png"
          curl -fL --retry 3 --max-time 40 "$PHOTO_6" -o "apps/web/public/menu-generated/paneer-pulav.png"
          curl -fL --retry 3 --max-time 40 "$PHOTO_7" -o "apps/web/public/menu-generated/regular-combo.png"
          curl -fL --retry 3 --max-time 40 "$PHOTO_8" -o "apps/web/public/menu-generated/paneer-combo.png"
          curl -fL --retry 3 --max-time 40 "$PHOTO_9" -o "apps/web/public/menu-generated/paneer-kathi-roll.png"
          curl -fL --retry 3 --max-time 40 "$PHOTO_10" -o "apps/web/public/menu-generated/masala-pav.png"
          file apps/web/public/menu-generated/*.png
      - name: Commit permanent image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/menu-generated/
          git commit -m "Add generated restaurant menu food photos" || exit 0
          git push
